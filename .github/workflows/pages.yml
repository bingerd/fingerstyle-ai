# Builds the public, read-only tab showcase (SHOWCASE=1 static export) and deploys it to GitHub Pages.
# Custom domain: tabs.bngrd.com (public/CNAME). Curate pieces with scripts/showcase-export.mts.
name: Showcase → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - name: Soundfonts (MuseScore General, MIT; FreePats nylon guitar, CC0)
        run: |
          curl -fsSL -o public/alphatab/MuseScore_General.sf3 https://ftp.osuosl.org/pub/musescore/soundfont/MuseScore_General/MuseScore_General.sf3
          FREEPATS=nylon npx tsx scripts/soundfonts.mts
      # Route types (RouteContext) for the whole app, so the type check passes on a fresh checkout.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx next build
        env:
          SHOWCASE: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
